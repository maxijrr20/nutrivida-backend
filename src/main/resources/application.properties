spring.application.name=nutrivida-backend
server.port=${PORT:8080}

# --- Base de datos PostgreSQL (AWS RDS o local) ---
# Los datos reales de conexión se entregan con variables de entorno, nunca en el repositorio.
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/nutrivida}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD:}

# Flyway crea y versiona las tablas (src/main/resources/db/migration).
# Hibernate solo comprueba que las entidades calcen con las tablas: no las modifica.
spring.flyway.enabled=true
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# --- JWT ---
# JWT_SECRET: clave de firma HS256 de al menos 32 caracteres. Va solo en variables de entorno.
app.jwt.secret=${JWT_SECRET:}
app.jwt.duracion-minutos=${JWT_DURACION_MINUTOS:60}
app.jwt.emisor=nutrivida-backend
app.jwt.destinatario=nutrivida-frontend

# --- CORS: orígenes del frontend que pueden llamar a la API ---
app.cors.origenes-permitidos=${CORS_ORIGENES:http://localhost:5173,https://maxijrr20.github.io}

# --- Swagger UI ---
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs
